name: FarmFresh CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-check:
    name: Build and Validate FarmFresh
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend --ignore-scripts

      - name: Check JavaScript syntax
        run: |
          find backend frontend admin -type f -name "*.js" \
            -not -path "*/node_modules/*" \
            -print0 | xargs -0 -r -n1 node --check

      - name: Build Docker image
        run: docker build -t farmfresh-ci:${{ github.sha }} .

      - name: CI result
        run: echo "FarmFresh CI pipeline completed successfully."

  publish-docker-image:
    name: Publish FarmFresh to Docker Hub
    runs-on: ubuntu-latest
    needs: build-and-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/farmfresh-ecommerce:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/farmfresh-ecommerce:${{ github.sha }}
