
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | FarmFresh</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<header class="navbar">
    <a href="index.html" class="logo">🌿 FarmFresh</a>
    <a href="products.html" class="nav-login">Shop Products</a>
</header>

<div class="auth-container">
    <div class="auth-decoration">
        <span>🌱</span>
        <h2>Join FarmFresh</h2>
        <p>Create your account and discover our product collection.</p>
    </div>

    <div class="auth-card">
        <span class="eyebrow">GET STARTED</span>
        <h1>Create Account</h1>
        <p>Enter your details below.</p>

        <form id="register-form">
            <label for="register-name">Full Name</label>
            <input
                type="text"
                id="register-name"
                placeholder="Your full name"
                required
            >

            <label for="register-email">Email Address</label>
            <input
                type="email"
                id="register-email"
                placeholder="you@example.com"
                required
            >

            <label for="register-password">Password</label>
            <input
                type="password"
                id="register-password"
                placeholder="Minimum 8 characters"
                minlength="8"
                required
            >

            <button type="submit" class="btn-primary full-width">
                Create Account
            </button>

            <p id="register-message" class="form-message"></p>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</div>

<script src="js/auth.js"></script>

</body>
</html>
