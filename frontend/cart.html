
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | FarmFresh</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">🌿 FarmFresh</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
    </nav>
    <a href="login.html" class="nav-login">Account</a>
</header>

<section class="page-banner">
    <span class="eyebrow">YOUR SELECTION</span>
    <h1>Shopping Cart</h1>
    <p>Review your items before checkout.</p>
</section>

<section class="section cart-section">
    <div id="cart-items">
        <p class="loading">Loading your cart...</p>
    </div>

    <div class="cart-summary">
        <h2>Order Summary</h2>

        <div class="summary-row">
            <span>Subtotal</span>
            <strong id="cart-subtotal">₹0.00</strong>
        </div>

        <div class="summary-row">
            <span>Delivery</span>
            <strong>Calculated at checkout</strong>
        </div>

        <div class="summary-row total-row">
            <span>Total</span>
            <strong id="cart-total">₹0.00</strong>
        </div>

        <a href="checkout.html" class="btn-primary full-width">
            Proceed to Checkout →
        </a>

        <a href="products.html" class="continue-shopping">
            Continue Shopping
        </a>
    </div>
</section>

<footer class="footer">
    <div class="copyright">© 2026 FarmFresh. All rights reserved.</div>
</footer>

<script src="js/cart.js"></script>

</body>
</html>
