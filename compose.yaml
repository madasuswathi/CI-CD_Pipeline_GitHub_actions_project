services:
  db:
    image: mysql:8.0
    container_name: farmfresh-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Missing DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:?Missing DB_NAME}
      MYSQL_USER: ${DB_USER:?Missing DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD}
    volumes:
      - farmfresh_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/catalog-data.sql:/docker-entrypoint-initdb.d/02-catalog-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmfresh-app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      PORT: 5000
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  farmfresh_mysql_data:
